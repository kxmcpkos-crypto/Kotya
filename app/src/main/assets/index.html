<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Рыжий забег</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap">
<style>
:root{padding:0}
/* Layout: full-screen canvas, HUD pills on top, round controls in bottom corners */
:root{--sky:#5fb8f0;--ink:#123a6b;--pill:#1d4f8f;--gold:#ffc23a;--fish:#3aa9ff;--heart:#ee2b3b;--paper:#fffaf0;--font:'Rubik',system-ui,sans-serif;color-scheme:light}
html,body{height:100%}
body{background:var(--sky);margin:0;overflow:hidden;font-family:var(--font);user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;flex-wrap:wrap;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;pointer-events:none}
.pill{background:var(--pill);color:#fff;border:3px solid #fff;border-radius:999px;padding:6px 16px;font-weight:800;font-size:clamp(15px,2.6vw,24px);box-shadow:0 4px 0 #0c2f5a;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.lvl{flex-direction:column;align-items:flex-start;gap:3px;padding:5px 16px}
.bar{width:clamp(70px,14vw,160px);height:7px;background:#0c2f5a;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#58d0ff}
.hearts{margin-left:auto;font-size:clamp(20px,3.6vw,34px);letter-spacing:2px;color:var(--heart);text-shadow:0 2px 0 #8a0f1a}
.hearts .off{color:#ffffff66;text-shadow:none}
.tip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 2*clamp(84px,15vw,130px) - 56px));background:var(--paper);border:3px solid #fff;border-radius:20px;box-shadow:0 5px 0 #0c2f5a55;padding:10px 16px;color:var(--ink);font:700 clamp(12px,2vw,17px)/1.3 var(--font);display:flex;gap:10px;align-items:center;pointer-events:none}
.tip span{font-size:1.8em}
#snd,#pause{pointer-events:auto;width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:var(--pill);color:#fff;font:800 18px var(--font);cursor:pointer;box-shadow:0 4px 0 #0c2f5a}
.ctl{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:clamp(84px,15vw,130px);aspect-ratio:1;border-radius:50%;border:3px solid #ffffffcc;background:#ffffff33;backdrop-filter:blur(4px);color:#fff;font:800 clamp(13px,2vw,18px) var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-shadow:0 2px 3px #0006;cursor:pointer}
.ctl b{font-size:2.2em;line-height:1}
#jump{left:max(16px,env(safe-area-inset-left,0px))}
#duck{right:max(16px,env(safe-area-inset-right,0px))}
.ctl:active{background:#ffffff66}
.ctl:focus-visible,#pause:focus-visible,#snd:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0c2f5a66;z-index:5;padding:16px}
.card{background:var(--paper);color:var(--ink);border:4px solid #fff;border-radius:24px;padding:24px 28px;max-width:420px;text-align:center;box-shadow:0 8px 0 #0c2f5a}
.card h1{margin:0 0 6px;font-size:34px;color:#e8731f;text-wrap:balance}
.card p{margin:6px 0 14px;font-size:16px;line-height:1.45}
.go{background:var(--gold);border:3px solid #fff;border-radius:999px;padding:12px 30px;font:800 20px var(--font);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 #c98a00}
.small{font-size:13px;opacity:.75}
.skin small.ab{font-size:11px;line-height:1.3;opacity:.75;font-weight:600;text-align:center}
.ctl.pwr{--p:0;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px) + clamp(84px,15vw,130px));width:clamp(64px,11vw,96px);background:conic-gradient(#ff8a1ccc calc(var(--p)*1%),#ffffff2a 0);font-size:clamp(11px,1.6vw,14px)}
.ctl.pwr b{font-size:1.9em;filter:grayscale(.7);opacity:.7}
.ctl.pwr.ready{background:radial-gradient(#ffc23a,#ff6a1c);border-color:#fff;animation:pglow .5s ease-in-out infinite alternate}
.ctl.pwr.ready b{filter:none;opacity:1}
.ctl.pwr.on{background:radial-gradient(#fff3a8,#ff4d1c);animation:none}
@keyframes pglow{from{box-shadow:0 0 0 3px #ffc23a88,0 0 12px #ff8a1c}to{box-shadow:0 0 0 7px #ffc23a55,0 0 30px #ff6a1c;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.ctl.pwr.ready{animation:none;box-shadow:0 0 0 5px #ffc23a}}
.spic{height:62px;width:auto;margin-top:4px}.skin.lock .spic{filter:grayscale(.6) opacity(.7)}
.mcat{height:96px;width:auto;display:block;margin:-8px auto 0;animation:mbob .45s ease-in-out infinite alternate}@keyframes mbob{to{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.mcat{animation:none}}
.evb{background:linear-gradient(135deg,#3a2350,#ff8a1c);color:#fff;border-radius:16px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.4}
.rec .hud>*:not(#pause){visibility:hidden}.rec #pause{opacity:.18}.rec .ctl,.rec .tip{display:none!important}
.q small{display:block}.pips{display:flex;gap:4px;margin-top:6px}.pips i{width:22px;height:8px;border-radius:4px;background:#e1ebf5}.pips i.on{background:linear-gradient(90deg,#ffc23a,#ff9f1c)}
.q.set{cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}.q.set input[type=range]{width:45%;accent-color:#58c3ff}.q.set input[type=checkbox]{width:24px;height:24px;accent-color:#58c3ff}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.days div{background:#e9f4ff;border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700}
.days div b{font-size:15px}.days .done{opacity:.45}.days .now{background:#ffc23a;box-shadow:0 0 0 3px #fff,0 0 0 5px #ffc23a;animation:pop .5s}.days .big{background:#ffe0f4}
.quests{display:flex;flex-direction:column;gap:10px;margin:14px 0;text-align:left}
.q{background:#fff;border:3px solid #dbe6f2;border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.q.ok{border-color:#58c3ff;background:#eef9ff}.q>div{flex:1;min-width:0}.q b{display:block;font-size:15px}
.qbar{height:8px;background:#e1ebf5;border-radius:9px;overflow:hidden;margin:6px 0 2px}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#58c3ff,#4dd97a)}
.q small{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}.q .go{padding:8px 14px;font-size:15px}
.rew{font-weight:800;white-space:nowrap}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff4d6d;margin-left:6px;vertical-align:middle}
.adbox{background:#123a6b;color:#fff;border-radius:16px;padding:30px 10px;margin:12px 0;font-size:15px}.adbox b{display:block;font-size:44px}
.pill.bump{animation:bump .22s ease-out}@keyframes bump{50%{transform:scale(1.2)}}
.card{width:min(440px,100%);max-height:calc(100% - 20px);overflow:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:14px 0}
.stats div{background:#e9f4ff;border-radius:16px;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:24px;font-variant-numeric:tabular-nums}.stats span{font-size:12px;font-weight:700;opacity:.65;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.go.alt{background:#58c3ff;box-shadow:0 5px 0 #1f86c9}.go.ghost{background:#fff;box-shadow:0 5px 0 #c9d6e6;border-color:#c9d6e6}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #c98a00}
.badge{display:inline-block;background:#e8731f;color:#fff;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:800;margin-bottom:4px;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:12px 0 16px}
.skin{background:#fff;border:3px solid #dbe6f2;border-radius:18px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font:700 14px var(--font);color:var(--ink);cursor:pointer}
.skin.sel{border-color:#58c3ff;background:#eef9ff}.skin.lock{opacity:.8}.skin.lock .face{filter:saturate(.5)}
.skin span{font-size:12px;opacity:.7}.skin.sel span{color:#1f86c9;opacity:1}
.face{position:relative;width:54px;height:46px;border-radius:50%;background:var(--o);border:3px solid var(--k);margin-top:12px}
.face::before,.face::after{content:"";position:absolute;top:-14px;width:18px;height:20px;background:var(--o);border:3px solid var(--k);border-bottom:0;clip-path:polygon(50% 0,100% 100%,0 100%);z-index:-1}
.face::before{left:2px}.face::after{right:2px}
.face i{position:absolute;left:4px;right:4px;bottom:-9px;height:9px;border-radius:9px;background:var(--sc);border:2px solid var(--k)}
.face b{position:absolute;top:14px;width:8px;height:11px;border-radius:50%;background:#1b3f8a}.face b:first-child{left:13px}.face b:nth-child(2){right:13px}
.pw{display:flex;gap:6px}.pw span{background:#ffffffdd;border-radius:999px;padding:4px 10px;font:800 14px var(--font);color:var(--ink);font-variant-numeric:tabular-nums}
</style>

<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="pill">🐟 <span id="score">0</span></div>
    <div class="pill lvl"><span id="lvl">Уровень 1</span><div class="bar"><i id="prog"></i></div></div>
    <div class="pw" id="pw"></div>
    <div class="hearts" id="hearts"></div>
    <button id="snd" aria-label="Музыка">♪</button>
    <button id="pause" aria-label="Пауза">II</button>
  </div>
  <button class="ctl" id="jump"><b>↑</b>Прыжок</button>
  <div class="tip" id="tip" hidden><span>🐱</span>Собирай рыбки, прыгай через препятствия и избегай чаек!</div>
  <button class="ctl pwr" id="pwr" aria-label="Кошачий рывок"><b>🔥</b></button>
  <button class="ctl" id="duck"><b>↓</b>Присесть</button>
  <div class="overlay" id="ov"><div class="card" id="card"></div></div>
</div>

<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
let W,H,G,S,CX=0,PORT=false; // width, height, ground y, scale
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);PORT=H>W*1.1;S=PORT?Math.min(W/600,H/900):Math.min(H/600,W/500);G=PORT?H*0.64:H*0.72;CX=W*(PORT?.16:.22);}
addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('kotoBest')||0}catch(e){}
const st={run:false,paused:false,score:0,lives:3,speed:0,t:0,dist:0,objs:[],parts:[],inv:0,level:1,magnet:0,shield:false,shake:0,banner:0,texts:[],combo:0,fly:[],dust:[],revived:false};
const cat={y:0,vy:0,duck:false,onG:true,jumps:0};
const $=id=>document.getElementById(id);
const SKINS=[{n:'Рыжик',p:0,o:'#f7902f',o2:'#dc6b16',l:'#fffaf2',k:'#6b3510',sc:'#2c63e0',sc2:'#5b8cf0'},
{n:'Дымок',p:50,o:'#a3adb8',o2:'#7a8590',l:'#f4f6f8',k:'#3c4450',sc:'#e23b4a',sc2:'#ff7a85'},
{n:'Уголёк',p:120,o:'#3c3d4a',o2:'#26262f',l:'#e8e6f0',k:'#121218',sc:'#ffc23a',sc2:'#ffe08a'},
{n:'Персик',p:200,o:'#f8d6ad',o2:'#e3ad78',l:'#fffaf2',k:'#7a4a22',sc:'#ff6fae',sc2:'#ffa6cf'},
{n:'Тигрёнок',p:350,o:'#ffb238',o2:'#b8500a',l:'#fff6e0',k:'#5a2a05',sc:'#2fb86a',sc2:'#7fe0a6'},
{n:'Тыковка',p:0,ev:150,o:'#2e2838',o2:'#1b1622',l:'#ece4f4',k:'#0e0b12',sc:'#ff8a1c',sc2:'#ffb35c',hat:1}];
const EVD=new Date(),EVENT=(EVD.getMonth()===9&&EVD.getDate()>=15)||(EVD.getMonth()===10&&EVD.getDate()<=3);
let bank=0,skin=0,owned=[0],lastRun=null,day='',streak=0,quests=[],pendingDaily=false,tut=false,candy=0,up={mag:0,pu:0,ss:0},cfg={vm:.8,vs:.8,vib:true};
function applySave(d){bank=d.bank||0;skin=d.skin||0;owned=d.owned||[0];day=d.day||'';streak=d.streak||0;quests=d.quests||[];tut=!!d.tut;candy=d.candy||0;up=Object.assign(up,d.up||{});cfg=Object.assign(cfg,d.cfg||{});best=Math.max(best,d.best||0);}
try{applySave(JSON.parse(localStorage.getItem('kotoSave')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('kotoSave',JSON.stringify({bank,skin,owned,best,day,streak,quests,tut,up,cfg,candy}))}catch(e){}if(window.cloudSave)window.cloudSave({bank,skin,owned,best,day,streak,quests,tut,up,cfg,candy});}
const skinURL={};
function skinPic(i,fr){fr=fr||'run2';const key=i+fr;if(skinURL[key])return skinURL[key];if(typeof IMG==='undefined')return '';const own=i>0?ownImg(i,fr):null;if(!own&&!ok(IMG[fr]))return '';const im=own||IMG[fr],c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d');g.filter=own?'none':(SKF[i]||'none');g.drawImage(im,0,0);try{skinURL[key]=c.toDataURL('image/png');}catch(e){return '';}return skinURL[key];}
let menuAnim=0;
const face=k=>{const i=SKINS.indexOf(k),u=!cfg.classic&&skinPic(i);return u?`<img class="spic" src="${u}" alt="">`:faceOld(k);};
const faceOld=k=>`<div class="face\" style="--o:${k.o};--k:${k.k};--sc:${k.sc}"><b></b><b></b><i></i></div>`;
function show(m){const c=$('card');let h='';
 if(m==='menu')h=`${!cfg.classic&&skinPic(skin,'run0')?'<img id="mcat" class="mcat" src="'+skinPic(skin,'run0')+'" alt="">':''}<h1>Рыжий забег</h1>${EVENT?`<div class="evb">🎃 <b>Хэллоуин до 3 ноября!</b><br>Собирай конфеты 🍬 ${Math.min(candy,150)}/150 — получишь котика Тыковку</div>`:''}<div class="stats"><div><b>${best}</b><span>Рекорд</span></div><div><b>🐟 ${bank}</b><span>Копилка</span></div></div><p>Собирай рыбки, прыгай через брёвна и ящики, приседай под чайками. Лови бонусы: 🧲 магнит, 🛡️ щит, ❤️ жизнь.<br><span class="small">Пробел / ↑ — прыжок (дважды — двойной), ↓ — присесть</span></p><div class="row"><button class="go" data-a="play">Играть</button><button class="go alt" data-a="shop">Котики</button><button class="go ghost" data-a="quests">Задания${quests.some(q=>q.done)?'<span class="dot"></span>':''}</button><button class="go ghost" data-a="up">Улучшения</button><button class="go ghost" data-a="set" aria-label="Настройки">⚙</button></div>`;
 else if(m==='shop')h=`<h1>Котики</h1><p>Копилка: <b>🐟 ${bank}</b></p><div class="skins">${SKINS.map((k,i)=>{const own=owned.includes(i);return `<button class="skin ${i===skin?'sel':''} ${own?'':'lock'}" data-a="skin" data-i="${i}">${face(k)}<b>${k.n}</b><small class="ab">${ABIL[i]?ABIL[i].ic+' '+ABIL[i].sp:''}<br>${ABIL[i]?ABIL[i].ps:''}</small><span>${i===skin?'Выбран':own?'Выбрать':k.ev?'🍬 '+Math.min(candy,k.ev)+'/'+k.ev:'🐟 '+k.p}</span></button>`}).filter((_,i)=>!SKINS[i].ev||EVENT||owned.includes(i)).join('')}</div><div class="row"><button class="go" data-a="play">Играть</button><button class="go ghost" data-a="menu">Назад</button></div>`;
 else if(m==='pause')h=`<h1>Пауза</h1><p>Рыбок: <b>${st.score}</b> · Уровень ${st.level}</p><div class="row"><button class="go" data-a="resume">Продолжить</button><button class="go alt" data-a="play">Заново</button><button class="go ghost" data-a="menu">Меню</button></div>`;
 else if(m==='over'){const r=lastRun;h=`${r.rec?'<div class="badge">Новый рекорд!</div>':''}<h1>Ой, котик устал!</h1><div class="stats"><div><b>${r.score}</b><span>Рыбок</span></div><div><b>${r.m} м</b><span>Пробежал</span></div><div><b>${best}</b><span>Рекорд</span></div></div><p>В копилку: <b>+🐟 ${r.score}</b> (всего ${bank})</p><div class="row"><button class="go" data-a="play">Ещё раз</button><button class="go alt" data-a="share">📤 Поделиться</button><button class="go alt" data-a="quests">Задания${quests.some(q=>q.done)?'<span class="dot"></span>':''}</button><button class="go ghost" data-a="menu">Меню</button></div>`;}
 else if(m==='daily'){h=`<h1>Награда дня</h1><p>Заходи каждый день — награда растёт. На 7-й день большой улов!</p><div class="days">${DR.map((r,i)=>`<div class="${i<streak-1?'done':''} ${i===streak-1?'now':''} ${i===6?'big':''}"><span>День ${i+1}</span><b>🐟${r}</b></div>`).join('')}</div><button class="go" data-a="daily">Забрать 🐟 ${DR[streak-1]}</button>`;}
 else if(m==='quests'){h=`<h1>Задания</h1><div class="quests">${quests.map((q,i)=>{const P=POOL.find(z=>z.k===q.k),pr=Math.min(q.p,q.g);return `<div class="q ${q.done?'ok':''}"><div><b>${tr(P.t).replace('{g}',q.g)}</b><div class="qbar"><i style="width:${pr/q.g*100}%"></i></div><small>${pr} / ${q.g}</small></div>${q.done?`<button class="go" data-a="claim" data-i="${i}">🐟 ${q.r}</button>`:`<span class="rew">🐟 ${q.r}</span>`}</div>`}).join('')}</div><div class="row"><button class="go" data-a="play">Играть</button><button class="go ghost" data-a="menu">Назад</button></div>`;}
 else if(m==='up'){h=`<h1>Улучшения</h1><p>Копилка: <b>🐟 ${bank}</b></p><div class="quests">${UPG.map(u=>{const l=up[u.k],mx=u.c.length,pips=Array.from({length:mx},(_,i)=>`<i class="${i<l?'on':''}"></i>`).join('');return `<div class="q ${l>=mx?'ok':''}"><div><b>${u.n}</b><small>${u.d}</small><div class="pips">${pips}</div></div>${l>=mx?'<span class="rew">Макс.</span>':`<button class="go ${bank<u.c[l]?'ghost':''}" data-a="buyup" data-k="${u.k}">🐟 ${u.c[l]}</button>`}</div>`}).join('')}</div><div class="row"><button class="go" data-a="play">Играть</button><button class="go ghost" data-a="menu">Назад</button></div>`;}
 else if(m==='set')h=`<h1>Настройки</h1><div class="quests"><label class="q set"><div><b>Музыка</b></div><input type="range" id="vm" min="0" max="1" step="0.05" value="${cfg.vm}"></label><label class="q set"><div><b>Звуки</b></div><input type="range" id="vs" min="0" max="1" step="0.05" value="${cfg.vs}"></label><label class="q set"><div><b>Вибрация</b><small>При ударе о препятствие</small></div><input type="checkbox" id="vibc" ${cfg.vib?'checked':''}></label><label class="q set"><div><b>Режим записи видео</b><small>Скрывает кнопки и счёт во время забега</small></div><input type="checkbox" id="recc" ${cfg.rec?'checked':''}></label><div class="q set"><div><b>Язык</b></div><div class="row"><button class="go ${lang==='ru'?'':'ghost'}" data-a="lang" data-l="ru">RU</button><button class="go ${lang==='en'?'':'ghost'}" data-a="lang" data-l="en">EN</button></div></div><label class="q set"><div><b>Классическая графика</b><small>Простая рисованная, для слабых телефонов</small></div><input type="checkbox" id="clsc" ${cfg.classic?'checked':''}></label><button class="q set" data-a="retut"><div><b>Пройти обучение заново</b></div><span class="rew">↻</span></button></div><button class="go ghost" data-a="menu">Готово</button>`;

const ok=i=>i&&i.complete&&i.naturalWidth>0;

const SKF=['none','grayscale(1) brightness(1.05)','grayscale(.85) brightness(.42) contrast(1.2)','saturate(.45) brightness(1.18)','saturate(1.5) contrast(1.12) hue-rotate(-8deg)','grayscale(.9) brightness(.38) contrast(1.25)'];
const tcache={};
function skinFrames(i){const r=[];for(let j=0;j<6;j++){const im=IMG['k'+i+'_run'+j];if(ok(im))r.push(im);}return r;}
function NF(){const f=skin>0?skinFrames(skin):[];return f.length||5;}
function ownImg(i,k){const f=skinFrames(i);if(!f.length)return null;if(k.startsWith('run'))return f[(+k.slice(3))%f.length];if(k==='sit')return ok(IMG['k'+i+'_sit'])?IMG['k'+i+'_sit']:f[0];return f[1%f.length];}
function catImg(k){const own=skin>0&&ownImg(skin,k);if(own)return own;const im=IMG[k];if(skin===0||!ok(im))return im;const key=k+skin;if(tcache[key])return tcache[key];
  const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d');g.filter=SKF[skin]||'none';g.drawImage(im,0,0);tcache[key]=c;return c;}
function drawCatSprite(){
  const d=cat.duck&&cat.onG,air=!cat.onG,run=st.run&&!st.paused;
  cat.dt=(cat.dt||0)+((d?1:0)-(cat.dt||0))*.3;
  if(run&&cat.land>0)cat.land--;
  // step phase follows distance travelled, so legs match ground speed
  const stepLen=24*S,ph=run?st.dist/stepLen:tk*.1,fi=Math.floor(ph)%NF(),fr=ph-Math.floor(ph);
  const cx=CX+10*S,base=G+cat.y+4*S;
  let sx=1,sy=1,rot=0,bob=0,h=112*S,frA,frB=null,mixB=0;
  if(air){frA='jump';h=118*S;const v=cat.vy/S;if(v<0){sy=1+Math.min(.1,-v*.008);sx=1/sy;}rot=Math.max(-.18,Math.min(.22,v*.016));}
  else if(cat.dt>.5){frA='sit';h=(78+(1-cat.dt)*30)*S;sy=.92;sx=1.06;}
  else{frA='run'+fi;h=118*S;
    bob=-Math.abs(Math.sin(ph*Math.PI))*2*S;rot=.02;
    const k=Math.abs(Math.cos(ph*Math.PI));sy=1-k*.03;sx=1+k*.02;}
  if(cat.land>0&&!air){const k=Math.sin(cat.land/12*Math.PI)*.16;sy*=1-k;sx*=1+k*.8;}
  const sh=Math.max(.35,1+cat.y/(260*S));x.fillStyle='#00000038';x.beginPath();x.ellipse(cx,G+3*S,32*S*sh,7*S*sh,0,0,7);x.fill();
  x.save();x.translate(cx,base+bob);x.rotate(rot);x.scale(sx,sy);
  if(st.happy>0&&!air){const k=1+Math.sin(st.happy*.4)*.03;x.scale(k,1/k);}
  const draw=(k,a)=>{const im=catImg(k),iw=im.width||im.naturalWidth,ih=im.height||im.naturalHeight,w=h*iw/ih;x.globalAlpha=a;x.drawImage(im,-w/2,-h,w,h);return w;};
  let w=draw(frA,1);x.globalAlpha=1;
  const SK=SKINS[skin],hasOwn=skin>0&&skinFrames(skin).length>0;if((SK.hat||EVENT)&&!(hasOwn&&SK.hat)){const hx=hasOwn?w*.15:w*(frA==='sit'?.1:.2),hy=hasOwn?-h*.98:-h*(frA==='sit'?.97:.86);x.fillStyle='#f07a12';x.strokeStyle='#5a2a05';x.lineWidth=2*S;x.beginPath();x.ellipse(hx,hy,w*.2,h*.07,0,0,7);x.fill();x.stroke();x.fillStyle='#3b7a2a';x.fillRect(hx-2*S,hy-h*.1,4*S,h*.05);}
  if(st.inv>0&&st.run){x.font=`${18*S}px sans-serif`;x.textAlign='center';x.fillText('💫',w*.05,-h*1.02);}
  x.restore();
  if(run&&cat.land===11)for(let i=0;i<6;i++)st.dust.push({x:cx+(Math.random()-.5)*40*S,y:G-2*S,l:20,r:(3+Math.random()*4)*S});}
function tileMirror(img,ox,y,w,h,par){const off=wrapX(par,2*w);for(let k=-1;k*w<W+2*w;k++){const px=k*w-off;if(px>W||px+w<0)continue;if(((k%2)+2)%2===0)x.drawImage(img,px,y,w,h);else{x.save();x.translate(px+w,y);x.scale(-1,1);x.drawImage(img,0,0,w,h);x.restore();}}}

  x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';

  if(own&&ph>=2){x.fillStyle='#ffffffaa';for(let i=0;i<50;i++){x.globalAlpha=.3+.5*Math.abs(Math.sin(tk*.03+i));x.fillRect((i*137.5)%W,(i*61.7)%Math.max(by,1),2*s,2*s);}x.globalAlpha=1;}

  if(ph===3&&!own){x.fillStyle='#ffffffcc';for(let i=0;i<60;i++){const a=(i*137.5)%W,b=(i*71.3)%(G*.5);x.globalAlpha=.3+.5*Math.abs(Math.sin(st.t*.03+i));x.fillRect(a,b,2*s,2*s);}x.globalAlpha=1;}

  {const sh=gi.naturalHeight*.27,sy=gi.naturalHeight-sh,th=gh*.27;for(let yy=bt;yy<H;yy+=th-1){const off=wrapX(d+(Math.round((yy-bt)/th)%2)*gw*.13,2*gw);for(let k=-1;k*gw<W+2*gw;k++){const px=k*gw-off;if(px>W||px+gw<0)continue;x.drawImage(gi,0,sy,gi.naturalWidth,sh,px,yy,gw+1,th);}}}

  if(ph===3){x.globalCompositeOperation='multiply';x.fillStyle='#3e4f92';x.fillRect(0,tY,W,H);x.globalCompositeOperation='source-over';if(!own){x.fillStyle='#fff8dc';x.beginPath();x.arc(W*.8,H*.12,24*s,0,7);x.fill();}}
  if(EVENT)for(let i=0;i<W/(420*s)+2;i++){const px=wrapX(i*420*s+200*s-d,W+420*s)-210*s,py=G-14*s;x.fillStyle='#f07a12';x.beginPath();x.ellipse(px,py,16*s,12*s,0,0,7);x.fill();x.fillStyle='#ffe14d';x.beginPath();x.moveTo(px-9*s,py-4*s);x.lineTo(px-4*s,py-4*s);x.lineTo(px-6.5*s,py-9*s);x.moveTo(px+9*s,py-4*s);x.lineTo(px+4*s,py-4*s);x.lineTo(px+6.5*s,py-9*s);x.fill();x.fillRect(px-7*s,py+2*s,14*s,3*s);}
}

  if(o.k==='candy'&&ok(IMG.candy)){const w=o.w*1.5,h=w/asp(IMG.candy),cy=t+o.h/2+Math.sin(st.t*.1+o.x)*3*S;x.drawImage(IMG.candy,o.x+o.w/2-w/2,cy-h/2,w,h);return true;}
  if(!o.v&&o.k==='log'){gshadow(o.x+o.w/2,o.w*.5);const h=o.h*1.55;x.drawImage(IMG.log,o.x-6*S,G-o.y-h+4*S,o.w+12*S,h);return true;}
  if(!o.v&&o.k==='crate'){gshadow(o.x+o.w/2,o.w*.55);const h=o.h*1.22,w=h*IMG.crate.naturalWidth/IMG.crate.naturalHeight;x.drawImage(IMG.crate,o.x+o.w/2-w/2,G-o.y-h+3*S,w,h);return true;}
  if(o.k==='coin'){const s2=Math.max(Math.abs(Math.sin(st.t*.07+o.x*.01)),.15),h=o.h*1.15,w=h*.9*s2;x.drawImage(IMG.coin,o.x+o.w/2-w/2,t+o.h/2-h/2,w,h);return true;}
  if(o.k==='fish'){const h=o.h*1.05,w=h*1.38,cy=t+o.h/2+Math.sin(st.t*.1)*4*S;x.save();x.translate(o.x+o.w/2,cy);x.scale(-1,1);x.drawImage(IMG.fish,-w/2,-h/2,w,h);x.restore();return true;}
  if(IMG[o.k]&&(o.k==='magnet'||o.k==='shield'||o.k==='heart')){const r=o.w*.62,cy=t+o.h/2+Math.sin(st.t*.08)*5*S;x.drawImage(IMG[o.k],o.x+o.w/2-r,cy-r,2*r,2*r);return true;}
  return false;}
const conf=[];
function confetti(n){for(let i=0;i<(n||90);i++)conf.push({x:W*Math.random(),y:-20-Math.random()*H*.3,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:['#ff4d6d','#ffc23a','#4dd97a','#4db8ff','#9b6bff','#ff9ad5'][i%6],w:(6+Math.random()*6),l:240});}
function drawConf(){for(const p of conf){p.x+=p.vx;p.y+=p.vy;p.vx+=Math.sin(p.l*.1)*.05;p.r+=p.vr;p.l--;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2*Math.abs(Math.cos(p.l*.15))+1);x.restore();}for(let i=conf.length-1;i>=0;i--)if(conf[i].l<=0||conf[i].y>H+20)conf.splice(i,1);}
function frame(){tk++;
  if(st.run&&!st.paused){if(st.cd>0){if(st.cd%50===0)sfx('beep');st.cd--;}else if(st.hitstop>0)st.hitstop--;else update();}
  x.save();if(st.shake>0){if(!st.paused)st.shake--;x.translate((Math.random()-.5)*st.shake*S,(Math.random()-.5)*st.shake*S);}
  scene();st.objs.forEach(o=>{if(!o.dead||o.k==='log'||o.k==='crate'||o.k==='bird'){if(!(o.dead&&o.k!=='log'&&o.k!=='crate'))drawObj(o);else{x.globalAlpha=.4;drawObj(o);x.globalAlpha=1;}}});
  drawTrail();x.globalAlpha=(st.dash>0&&st.dashT===1)?.45:1;drawCat();x.globalAlpha=1;drawFx();fg();x.restore();{const g=x.createRadialGradient(W/2,H*.55,Math.min(W,H)*.45,W/2,H*.55,Math.max(W,H)*.85);g.addColorStop(0,'#00000000');g.addColorStop(1,'#0a183844');x.fillStyle=g;x.fillRect(0,0,W,H);}drawConf();
  st.parts.forEach(p=>{x.globalAlpha=p.l/30;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,4*S,0,7);x.fill();});x.globalAlpha=1;
  if(st.paused){x.fillStyle='#0c2f5a88';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font=`800 ${40*S}px Rubik,sans-serif`;x.textAlign='center';x.fillText(tr('Пауза'),W/2,H/2);}
  requestAnimationFrame(frame);
}
applyLang();applyRec();hud();show(pendingDaily?'daily':'menu');frame();
